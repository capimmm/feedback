<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Feedback</title>
<style>
    :root {
        --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        --mono: 'SF Mono', Menlo, Monaco, Consolas, monospace;
        --bg: #f5f5f7;
        --surface: rgba(255,255,255,.6);
        --surface-2: rgba(255,255,255,.78);
        --border: rgba(255,255,255,.75);
        --text: #1d1d1f;
        --text-2: #86868b;
        --accent: #0071e3;
        --accent-hover: #0077ed;
        --green: #30d158;
        --red: #ff453a;
        --purple: #af52de;
        --radius: 22px;
        --shadow-sm: 0 6px 20px rgba(0,0,0,.07);
        --shadow-lg: 0 24px 70px rgba(0,0,0,.14);
        --spring: cubic-bezier(0.32, 0.72, 0, 1);
        --smooth: cubic-bezier(0.25, 1, 0.5, 1);
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html {
        min-height: 100%;
        -webkit-text-size-adjust: 100%;
    }
    body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: calc(24px + var(--safe-t)) calc(24px + var(--safe-r)) calc(24px + var(--safe-b)) calc(24px + var(--safe-l));
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        overscroll-behavior-y: none;
    }
    body::before, body::after {
        content:''; position:fixed; border-radius:50%;
        filter: blur(120px); opacity:.5; z-index:-1; pointer-events:none;
        animation: float 22s ease-in-out infinite;
    }
    body::before { width:560px;height:560px; background: radial-gradient(circle,#a5c8ff,transparent 70%); top:-180px; left:-180px; }
    body::after  { width:640px;height:640px; background: radial-gradient(circle,#ffb8d9,transparent 70%); bottom:-220px; right:-220px; animation-delay:-11s; }
    @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,-30px) scale(1.08);} }
    @media (prefers-reduced-motion: reduce) {
        body::before, body::after { animation: none; }
    }

    /* ============ APP / SCREENS ============ */
    .app {
        width: 100%;
        max-width: 760px;
        display: grid;
        transition: max-width .7s var(--spring);
    }
    .app.focused { max-width: 1200px; }

    .screen {
        grid-area: 1/1;
        opacity: 0; filter: blur(14px);
        transform: scale(0.96) translateY(8px);
        visibility: hidden; pointer-events: none;
        transition: opacity .5s var(--smooth), filter .5s var(--smooth),
                    transform .7s var(--spring), visibility 0s linear .7s;
        display: flex; justify-content: center; align-items: center;
        width: 100%;
    }
    .screen.active {
        opacity: 1; filter: blur(0);
        transform: scale(1) translateY(0);
        visibility: visible; pointer-events: auto;
        transition: opacity .5s var(--smooth), filter .5s var(--smooth),
                    transform .7s var(--spring), visibility 0s;
    }

    /* ============ GLASS PANEL ============ */
    .panel {
        width: 100%;
        max-width: 560px;
        background: var(--surface);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border: 1px solid var(--border);
        border-radius: 26px;
        box-shadow: var(--shadow-lg);
        padding: 36px;
        transition: max-width .7s var(--spring), padding .7s var(--spring),
                    border-radius .7s var(--spring), box-shadow .7s var(--spring);
    }
    .panel.wide {
        max-width: 100%;
        padding: 44px 52px;
        border-radius: 30px;
        box-shadow: 0 40px 100px rgba(0,0,0,.18);
    }

    h1 { font-size: 30px; font-weight: 700; letter-spacing: -.7px; margin-bottom: 8px; }
    .subtitle { color: var(--text-2); font-size: 16px; line-height: 1.5; margin-bottom: 24px; }

    /* ============ HOME CARDS ============ */
    .stage {
        display: flex; gap: 16px; align-items: stretch;
        width: 100%;
        animation: stageIn .9s var(--spring) both;
    }
    @keyframes stageIn {
        from { opacity:0; transform: translateY(20px) scale(.97); filter: blur(8px); }
        to   { opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .peek {
        flex: 0 0 42px;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.20));
        border: 1px solid var(--border);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        box-shadow: 0 12px 30px rgba(0,0,0,.06);
        position: relative; overflow: hidden;
        animation: cardIn .8s var(--spring) both;
    }
    .peek::before {
        content:''; position:absolute; inset:0;
        background: linear-gradient(180deg, rgba(0,113,227,.18) 0%, transparent 45%, transparent 55%, rgba(255,94,138,.18) 100%);
    }
    .peek:first-child { animation-delay: .25s; }
    .peek:last-child  { animation-delay: .30s; }

    .card {
        position: relative; flex: 1 1 0; min-width: 0;
        min-height: 340px;
        padding: 30px 28px;
        display: flex; flex-direction: column;
        align-items: flex-start; text-align: left; gap: 16px;
        background: var(--surface);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow-sm);
        cursor: pointer; font-family: inherit; color: inherit;
        overflow: hidden;
        transition: transform .75s var(--spring), box-shadow .75s var(--spring),
                    background .4s var(--smooth), border-color .4s var(--smooth);
        animation: cardIn .85s var(--spring) both;
    }
    .card:nth-of-type(1) { animation-delay: .10s; }
    .card:nth-of-type(2) { animation-delay: .18s; }
    @keyframes cardIn {
        from { opacity:0; transform: translateY(24px) scale(.96); filter: blur(6px); }
        to   { opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .card::after {
        content:''; position:absolute; top:0; left:0; right:0; height:1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
        opacity:.7; pointer-events:none;
    }
    @media (hover: hover) {
        .card:hover {
            transform: translateY(-8px) scale(1.015);
            box-shadow: 0 32px 80px rgba(0,0,0,.16);
            background: rgba(255,255,255,.78);
            border-color: rgba(255,255,255,.95);
        }
        .card:hover .card-arrow { transform: translateX(4px); background: rgba(0,113,227,.15); color: var(--accent); }
    }
    .card:active { transform: scale(.975); transition-duration: .15s; }
    .card.opening {
        transform: scale(1.05);
        box-shadow: 0 45px 100px rgba(0,113,227,.35);
        transition: transform .55s var(--spring), box-shadow .55s var(--spring);
    }
    .card-icon {
        width: 58px; height: 58px; border-radius: 18px;
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; color: white; flex-shrink: 0;
        background: linear-gradient(135deg, #0071e3, #42a5ff);
        box-shadow: 0 10px 24px rgba(0,113,227,.35);
    }
    .card-icon.alt {
        background: linear-gradient(135deg, #ff5e8a, #ff9e64);
        box-shadow: 0 10px 24px rgba(255,94,138,.35);
    }
    .card h3 { font-size: 24px; font-weight: 700; letter-spacing: -.5px; line-height: 1.15; }
    .card p { font-size: 15px; color: var(--text-2); line-height: 1.5; }
    .card-arrow {
        position: absolute; bottom: 24px; right: 24px;
        width: 38px; height: 38px; border-radius: 50%;
        background: rgba(0,0,0,.06);
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; color: var(--text);
        transition: transform .55s var(--spring), background .35s var(--smooth), color .35s var(--smooth);
    }

    /* ============ BUTTONS ============ */
    .back-btn {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--surface-2);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        color: var(--text); font-family: inherit; font-size: 14px; font-weight: 500;
        padding: 10px 16px; border-radius: 100px; cursor: pointer;
        margin-bottom: 22px;
        min-height: 40px;
        transition: transform .45s var(--spring), background .3s;
    }
    .back-btn:hover { background: #fff; transform: translateX(-3px); }
    .back-btn:active { transform: scale(.95); }

    .btn-primary {
        width: 100%; padding: 16px;
        font-family: inherit; font-size: 17px; font-weight: 600;
        color: white; background: var(--accent);
        border: none; border-radius: 14px; cursor: pointer;
        margin-top: 8px;
        min-height: 52px;
        transition: transform .4s var(--spring), background .3s var(--smooth), box-shadow .4s var(--spring);
        box-shadow: 0 10px 26px rgba(0,113,227,.35);
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover {
        background: var(--accent-hover); transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(0,113,227,.4);
    }
    .btn-primary:active { transform: scale(.97); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .btn-ghost {
        padding: 11px 18px;
        font-family: inherit; font-size: 14px; font-weight: 600;
        color: var(--text); background: var(--surface-2);
        border: 1px solid rgba(0,0,0,.06); border-radius: 12px;
        cursor: pointer;
        min-height: 44px;
        transition: transform .4s var(--spring), background .3s, box-shadow .3s;
    }
    .btn-ghost:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.08); }
    .btn-ghost:active { transform: scale(.96); }

    /* ============ FORM ============ */
    .form-group { margin-bottom: 18px; }
    label {
        display: block; font-size: 13px; font-weight: 600;
        color: var(--text-2); margin-bottom: 6px; padding-left: 4px;
        text-transform: uppercase; letter-spacing: .4px;
    }
    input[type="text"], input[type="email"], input[type="url"] {
        width: 100%; padding: 14px 16px;
        font-family: inherit; font-size: 16px; color: var(--text);
        background: rgba(255,255,255,.65);
        border: 1px solid rgba(0,0,0,.08);
        border-radius: 14px; outline: none;
        min-height: 50px;
        transition: border-color .3s, box-shadow .3s, background .3s;
    }
    input:focus {
        border-color: var(--accent); background: #fff;
        box-shadow: 0 0 0 4px rgba(0,113,227,.15);
    }

    /* ============ EDITOR RICO ============ */
    .editor {
        border: 1px solid rgba(0,0,0,.08); border-radius: 16px;
        background: rgba(255,255,255,.65);
        overflow: hidden;
        transition: border-color .3s, box-shadow .3s, background .3s;
    }
    .editor:focus-within {
        border-color: var(--accent);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(0,113,227,.15);
    }
    .editor-toolbar {
        display: flex; gap: 4px; flex-wrap: wrap;
        padding: 8px 10px;
        background: rgba(0,0,0,.02);
        border-bottom: 1px solid rgba(0,0,0,.06);
        align-items: center;
        position: sticky; top: 0; z-index: 5;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
    .editor-toolbar button {
        width: 38px; height: 38px; border-radius: 10px;
        border: none; background: transparent; cursor: pointer;
        font-family: inherit; font-size: 15px; color: var(--text);
        display: flex; align-items: center; justify-content: center;
        transition: background .2s, transform .35s var(--spring), color .2s;
        flex-shrink: 0;
    }
    .editor-toolbar button:hover { background: rgba(0,113,227,.12); color: var(--accent); }
    .editor-toolbar button:active { transform: scale(.9); }
    .editor-toolbar button.on { background: rgba(0,113,227,.18); color: var(--accent); }
    .editor-toolbar .sep {
        width: 1px; height: 22px; background: rgba(0,0,0,.1); margin: 0 4px;
        flex-shrink: 0;
    }
    .editor-toolbar .spacer { flex: 1; }
    .editor-toolbar .focus-btn {
        width: auto; padding: 0 12px; gap: 6px;
        font-size: 12px; font-weight: 600;
        background: rgba(0,113,227,.10); color: var(--accent);
    }
    .editor-toolbar .focus-btn:hover { background: rgba(0,113,227,.18); }

    .editor-content {
        min-height: 160px; max-height: 320px; padding: 18px 20px;
        font-size: 16px; line-height: 1.6; outline: none;
        word-break: break-word;
        overflow-y: auto;
        transition: min-height .5s var(--spring), max-height .5s var(--spring),
                    font-size .5s var(--spring), padding .5s var(--spring);
        -webkit-user-select: text;
        user-select: text;
    }
    .editor-content:empty::before {
        content: attr(data-placeholder);
        color: var(--text-2); pointer-events: none;
    }
    .editor-content img { max-width: 100%; border-radius: 10px; margin: 6px 0; }
    .editor-content b, .editor-content strong { font-weight: 700; }
    .editor-content ul, .editor-content ol { padding-left: 24px; margin: 6px 0; }
    .editor-content a { color: var(--accent); word-break: break-all; }

    /* ============ MODO FOCO ============ */
    body.focus-mode { padding: 0; align-items: stretch; }
    body.focus-mode .app { max-width: 100%; height: 100vh; height: 100dvh; min-height: 100vh; }
    body.focus-mode .screen.active { width: 100%; height: 100vh; height: 100dvh; padding: 0; }
    body.focus-mode .panel.wide {
        height: 100vh;
        height: 100dvh;
        max-width: 100%;
        border-radius: 0;
        padding: calc(20px + var(--safe-t)) 12vw calc(20px + var(--safe-b)) 12vw;
        display: flex;
        flex-direction: column;
        box-shadow: none;
        border: none;
        background: rgba(255,255,255,.72);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
    }
    body.focus-mode .form-group.collapsible { display: none; }
    body.focus-mode .editor {
        flex: 1; display: flex; flex-direction: column; min-height: 0;
    }
    body.focus-mode .editor-content {
        flex: 1; max-height: none; min-height: 0;
        font-size: 19px; line-height: 1.7; padding: 30px 34px;
    }
    body.focus-mode .editor-content:empty::before { font-size: 19px; }
    body.focus-mode h1 { font-size: 40px; letter-spacing: -1px; margin-bottom: 6px; }
    body.focus-mode .subtitle { font-size: 17px; margin-bottom: 22px; }
    body.focus-mode .form-group:last-of-type { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-bottom: 12px; }
    body.focus-mode .form-group:last-of-type .editor { flex: 1; min-height: 0; }

    body.focus-mode .panel.wide > * { animation: focusIn .6s var(--spring) both; }
    @keyframes focusIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .focus-exit {
        position: fixed;
        top: calc(20px + var(--safe-t));
        right: calc(20px + var(--safe-r));
        z-index: 1000;
        padding: 10px 16px;
        min-height: 40px;
        background: rgba(0,0,0,.75);
        color: white;
        font-family: inherit; font-size: 13px; font-weight: 600;
        border: none; border-radius: 100px;
        cursor: pointer;
        display: none; align-items: center; gap: 6px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 24px rgba(0,0,0,.25);
        transition: transform .4s var(--spring), background .3s;
    }
    .focus-exit:hover { background: rgba(0,0,0,.9); transform: scale(1.05); }
    .focus-exit:active { transform: scale(.95); }
    body.focus-mode .focus-exit { display: inline-flex; animation: popIn .5s var(--spring); }
    @keyframes popIn {
        from { opacity: 0; transform: translateY(-10px) scale(.9); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .focus-hint {
        position: fixed;
        bottom: calc(20px + var(--safe-b));
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(0,0,0,.7); color: white;
        font-size: 12px; font-weight: 500; padding: 8px 16px;
        border-radius: 100px; opacity: 0;
        transition: opacity .5s var(--smooth), transform .5s var(--spring);
        pointer-events: none; z-index: 999;
        backdrop-filter: blur(10px);
    }
    body.focus-mode .focus-hint {
        opacity: 1; transform: translateX(-50%) translateY(0);
        transition-delay: 1s;
    }

    /* ============ UPLOAD DE IMAGEM ============ */
    .dropzone {
        border: 2px dashed rgba(0,113,227,.3);
        border-radius: 14px;
        padding: 18px;
        text-align: center;
        background: rgba(0,113,227,.04);
        cursor: pointer;
        transition: border-color .3s, background .3s, padding .4s var(--spring);
        margin-top: 6px;
    }
    .dropzone:hover, .dropzone.over {
        border-color: var(--accent);
        background: rgba(0,113,227,.08);
    }
    .dropzone p { font-size: 13px; color: var(--text-2); }
    .dropzone p b { color: var(--accent); }
    body.focus-mode .dropzone { padding: 10px; }

    .img-preview { position: relative; display: inline-block; margin-top: 10px; }
    .img-preview img {
        max-width: 180px; max-height: 140px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }
    .img-preview .remove {
        position: absolute; top: -8px; right: -8px;
        width: 30px; height: 30px; border-radius: 50%;
        background: var(--red); color: white; border: none;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px;
        box-shadow: 0 4px 12px rgba(255,69,58,.4);
        transition: transform .3s var(--spring);
    }
    .img-preview .remove:hover { transform: scale(1.1); }

    /* ============ LISTA DE FEEDBACKS ============ */
    .feedbacks-list {
        display: flex; flex-direction: column; gap: 12px;
        max-height: 60vh; overflow-y: auto;
        padding-right: 4px;
        -webkit-overflow-scrolling: touch;
    }
    .feedbacks-list::-webkit-scrollbar { width: 6px; }
    .feedbacks-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }

    .feedback-item {
        background: rgba(255,255,255,.7);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 20px;
        cursor: pointer;
        animation: slideIn .55s var(--spring) both;
        transition: transform .5s var(--spring), box-shadow .5s var(--spring), background .3s, border-color .3s;
    }
    @media (hover: hover) {
        .feedback-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 34px rgba(0,0,0,.10);
            background: #fff;
            border-color: rgba(0,113,227,.25);
        }
    }
    .feedback-item:active { transform: scale(.99); }
    @keyframes slideIn {
        from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
        to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .feedback-header {
        display: flex; justify-content: space-between;
        align-items: baseline; margin-bottom: 6px; gap: 12px;
        flex-wrap: wrap;
    }
    .feedback-name { font-weight: 600; font-size: 15px; }
    .feedback-date { font-size: 12px; color: var(--text-2); white-space: nowrap; }
    .feedback-msg {
        font-size: 15px; line-height: 1.55; color: #333;
        word-wrap: break-word;
        overflow-wrap: anywhere;
    }
    .feedback-msg img {
        max-width: 100%; border-radius: 10px; margin-top: 8px;
        display: block;
    }
    .fb-badge {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 10px; font-weight: 600;
        text-transform: uppercase; letter-spacing: .4px;
        padding: 2px 7px; border-radius: 100px;
        background: rgba(175,82,222,.15); color: var(--purple);
        margin-left: 6px;
    }

    .empty, .loading, .error-state {
        text-align: center; padding: 40px 20px;
        color: var(--text-2); font-size: 15px;
    }
    .loading::before {
        content: ''; display: inline-block;
        width: 16px; height: 16px;
        border: 2px solid rgba(0,0,0,.15); border-top-color: var(--accent);
        border-radius: 50%; animation: spin .8s linear infinite;
        margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state {
        background: rgba(255,69,58,.06);
        border-radius: 14px;
        color: #b3261e;
    }
    .error-state .retry {
        margin-top: 14px;
        padding: 10px 20px;
        font-family: inherit; font-size: 14px; font-weight: 600;
        color: white; background: var(--accent);
        border: none; border-radius: 12px; cursor: pointer;
        min-height: 44px;
        transition: transform .35s var(--spring), background .25s;
    }
    .error-state .retry:hover { background: var(--accent-hover); }
    .error-state .retry:active { transform: scale(.96); }

    /* ============ SUCESSO ============ */
    .success { text-align: center; padding: 12px 0; }
    .success-icon {
        width: 76px; height: 76px; margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #34c759, #30d158);
        display: flex; align-items: center; justify-content: center;
        font-size: 38px; color: white;
        box-shadow: 0 16px 40px rgba(52,199,89,.45);
        animation: pop .7s var(--spring) both;
    }
    @keyframes pop {
        0%   { transform: scale(0);   opacity: 0; }
        60%  { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1);   opacity: 1; }
    }

    /* ============ MODAL (input + emojis) ============ */
    .modal-backdrop {

    .modal {
        position: fixed;

    /* Abas de categoria */
    .emoji-tabs {

    .emoji-grid {
        display: grid;

        overflow-y: auto;

    .emoji-grid::-webkit-scrollbar { width: 6px; }

    .emoji-grid button {

    .emoji-grid button:hover {

    .emoji-grid button:active { transform: scale(.9); }

    .modal-actions {
        display: flex;

    .modal-actions button {
        padding: 12px 20px;

    }
    .modal-actions .cancel {
        background: rgba(0,0,0,.06);

    .modal-actions .cancel:hover { background: rgba(0,0,0,.1); }
    .modal-actions .cancel:active { transform: scale(.96); }

    .modal-actions .confirm {
        background: var(--accent);

        box-shadow: 0 8px 20px rgba(0,113,227,.3);
    }
    .modal-actions .confirm:hover {
        background: var(--accent-hover);
        box-shadow: 0 12px 26px rgba(0,113,227,.4);
        transform: translateY(-1px);
    }
    .modal-actions .confirm:active { transform: scale(.96); }

    /* ============ TOAST ============ */
    .toast {
        position: fixed;
        left: 50%;
        bottom: calc(30px + var(--safe-b));
        transform: translate(-50%, 80px);
        background: #1d1d1f; color: white;
        padding: 12px 22px; border-radius: 100px;
        font-size: 14px; font-weight: 500;
        box-shadow: 0 12px 40px rgba(0,0,0,.3);
        z-index: 2000; opacity: 0;

        max-width: calc(100vw - 32px);
        text-align: center;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.ok::before { content: '✓'; color: var(--green); font-weight: 700; }
    .toast.error::before { content: '✕'; color: var(--red); font-weight: 700; }

    /* ============ RESPONSIVO ============ */
    @media (max-width: 720px) {

    @media (max-width: 560px) {

        .editor-toolbar .sep { margin: 0 2px; }

        body.focus-mode .panel.wide {
            padding: calc(14px + var(--safe-t)) 18px calc(14px + var(--safe-b)) 18px;
        }
        body.focus-mode h1 { font-size: 26px; }
        body.focus-mode .subtitle { font-size: 15px; margin-bottom: 14px; }

        .modal { padding: 20px 18px 16px; border-radius: 20px; }

    }

    @media (max-width: 380px) {

        .editor-toolbar .focus-btn { padding: 0 8px; font-size: 11px; }
        .emoji-grid { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); }
    }
</style>

    <!-- ================= SUCESSO ================= -->

</div>

<!-- ============ MODAL (input/emoji) ============ -->
<div class="modal-backdrop" id="modal-backdrop"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true">
    <h3 id="modal-title">Título</h3>

        <input type="url" id="modal-input" placeholder="https://..." autocomplete="off" inputmode="url">

<div class="toast" id="toast"></div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // =====================================================
    const SUPABASE_URL = 'https://rqeakuvigmxtssadmdov.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B7R-o2Ekd3X6N2fpMgr9PQ_UPZwbmKk';
    const TABLE = 'feedbacks';
    const BUCKET = 'feedback-images';
    const QUERY_TIMEOUT = 15000; // 15s
    // =====================================================

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    /* ========== UTIL ========== */
    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function formatDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
    }
    function toast(msg, type='ok') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + type;
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.remove('show'), 2600);
    }
    function sanitizeHtml(html) {
        const allowed = ['b','strong','i','em','u','s','br','p','ul','ol','li','a','span','div','img'];
        const doc = new DOMParser().parseFromString(html || '', 'text/html');
        doc.querySelectorAll('*').forEach(el => {
            if (!allowed.includes(el.tagName.toLowerCase())) {
                el.replaceWith(...el.childNodes);
                return;
            }
            [...el.attributes].forEach(attr => {
                const tag = el.tagName.toLowerCase();
                if (tag === 'a' && attr.name === 'href') return;
                if (tag === 'img' && (attr.name === 'src' || attr.name === 'alt')) return;
                el.removeAttribute(attr.name);
            });
            if (el.tagName.toLowerCase() === 'a') {
                el.setAttribute('target', '_blank');
                el.setAttribute('rel', 'noopener noreferrer');
            }
        });
        return doc.body.innerHTML;
    }
    // Promise com timeout pra evitar spinner infinito
    function withTimeout(promise, ms, label = 'Operação') {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} demorou demais. Verifique sua conexão.`)), ms)),
        ]);
    }

    /* ========== NAVEGAÇÃO ========== */
    const screens = {
        home: document.getElementById('screen-home'),
        send: document.getElementById('screen-send'),
        success: document.getElementById('screen-success'),
        view: document.getElementById('screen-view'),
    };
    let currentScreen = 'home';
    function goTo(name) {
        if (name !== 'send') exitFocus();
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[name].classList.add('active');
        currentScreen = name;
    }
    document.querySelectorAll('.card[data-target]').forEach(card => {
        card.addEventListener('click', async () => {
            const target = card.dataset.target;
            card.classList.add('opening');
            await sleep(190);
            goTo(target);
            await sleep(750);
            card.classList.remove('opening');
            if (target === 'view') loadFeedbacks();
        });
    });
    document.querySelectorAll('[data-back]').forEach(btn => {
        btn.addEventListener('click', () => goTo('home'));
    });

    /* ========== MODO FOCO ========== */
    const app = document.getElementById('app');
    const focusBtn = document.getElementById('focus-btn');
    const focusIcon = document.getElementById('focus-icon');
    const focusLabel = document.getElementById('focus-label');
    const focusExit = document.getElementById('focus-exit');
    const editor = document.getElementById('editor');
    let isFocused = false;

    function enterFocus() {
        if (isFocused) return;
        isFocused = true;
        document.body.classList.add('focus-mode');
        app.classList.add('focused');
        document.getElementById('send-panel').classList.add('wide');
        focusLabel.textContent = 'Sair';
        setTimeout(() => { if (window.innerWidth > 560) editor.focus(); }, 300);
    }
    function exitFocus() {
        if (!isFocused) return;
        isFocused = false;
        document.body.classList.remove('focus-mode');
        app.classList.remove('focused');
        document.getElementById('send-panel').classList.remove('wide');
        focusLabel.textContent = 'Foco';
    }
    function toggleFocus() { isFocused ? exitFocus() : enterFocus(); }

    focusBtn.addEventListener('click', (e) => { e.preventDefault(); toggleFocus(); });
    focusExit.addEventListener('click', exitFocus);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isFocused && !modalEl.classList.contains('show')) {
            e.preventDefault(); exitFocus();
        }
    });
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'f') {
            e.preventDefault();
            if (screens.send.classList.contains('active')) toggleFocus();
        }
    });

    /* ========== SALVAR/RE-APLICAR SELEÇÃO ========== */
    let savedRange = null;
    function saveSelection() {
        const sel = window.getSelection();
        if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
            savedRange = sel.getRangeAt(0).cloneRange();
        }
    }
    function restoreSelection() {
        editor.focus();
        if (!savedRange) return;
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
    }

    /* ========== EDITOR RICO ========== */
    const toolbarButtons = document.querySelectorAll('.editor-toolbar button[data-cmd]');

    document.querySelectorAll('.editor-toolbar button').forEach(btn => {
        btn.addEventListener('mousedown', (e) => e.preventDefault());
        btn.addEventListener('touchstart', () => saveSelection(), { passive: true });
        btn.addEventListener('click', async (e) => {
            e.preventDefault();
            const cmd = btn.dataset.cmd;
            const action = btn.dataset.action;

            if (cmd) {
                if (cmd === 'createLink') {
                    saveSelection();
                    const url = await askInput({
                        title: 'Inserir link',
                        subtitle: 'Cole ou digite a URL que deseja vincular.',
                        placeholder: 'https://exemplo.com',
                    });
                    restoreSelection();
                    if (url) {
                        const sel = window.getSelection();
                        if (sel.isCollapsed) {
                            document.execCommand('insertHTML', false,
                                `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`);
                        } else {
                            document.execCommand('createLink', false, url);
                        }
                    }
                } else {
                    document.execCommand(cmd, false, null);
                }
                updateToolbarState();
            } else if (action === 'img') {
                document.getElementById('img-input').click();
            } else if (action === 'emoji') {
                saveSelection();
                const emoji = await askEmoji();
                restoreSelection();
                if (emoji) document.execCommand('insertText', false, emoji);
            }
            editor.focus();
        });
    });

    function updateToolbarState() {
        toolbarButtons.forEach(btn => {
            const cmd = btn.dataset.cmd;
            if (!cmd) return;
            try {
                if (document.queryCommandState(cmd)) btn.classList.add('on');
                else btn.classList.remove('on');
            } catch { /* ignore */ }
        });
    }
    editor.addEventListener('keyup', updateToolbarState);
    editor.addEventListener('mouseup', updateToolbarState);
    editor.addEventListener('input', () => {
        if (editor.innerHTML === '<br>' || editor.innerHTML === '<div><br></div>') {
            editor.innerHTML = '';
        }
    });

    /* ========== UPLOAD DE IMAGEM ========== */
    const dropzone = document.getElementById('dropzone');
    const imgInput = document.getElementById('img-input');
    const imgPreviewContainer = document.getElementById('img-preview-container');
    let pendingImage = null;

    function removePendingImage() {
        if (pendingImage?.previewUrl) URL.revokeObjectURL(pendingImage.previewUrl);
        pendingImage = null;
        imgPreviewContainer.innerHTML = '';
    }
    function handleImageFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) { toast('Arquivo precisa ser uma imagem.', 'error'); return; }
        if (file.size > 5 * 1024 * 1024) { toast('Imagem maior que 5 MB.', 'error'); return; }
        removePendingImage();
        const url = URL.createObjectURL(file);
        pendingImage = { file, previewUrl: url };
        imgPreviewContainer.innerHTML = `
            <div class="img-preview">
                <img src="${url}" alt="">
                <button class="remove" type="button" title="Remover">✕</button>
            </div>`;
        imgPreviewContainer.querySelector('.remove').addEventListener('click', removePendingImage);
        toast('Imagem anexada.');
    }
    dropzone.addEventListener('click', () => imgInput.click());
    imgInput.addEventListener('change', e => handleImageFile(e.target.files[0]));
    ['dragenter','dragover'].forEach(evt =>
        dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('over'); })
    );
    ['dragleave','drop'].forEach(evt =>
        dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('over'); })
    );
    dropzone.addEventListener('drop', e => handleImageFile(e.dataTransfer.files[0]));
    editor.addEventListener('paste', (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (const it of items) {
            if (it.type.startsWith('image/')) {
                e.preventDefault();
                handleImageFile(it.getAsFile());
                return;
            }
        }
    });
    async function uploadImageToStorage(file) {
        const ext = (file.name.split('.').pop() || 'png').toLowerCase();
        const path = `public/${Date.now()}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
        const { error } = await withTimeout(
            supabase.storage.from(BUCKET).upload(path, file, {
                cacheControl: '31536000', upsert: false,
            }),
            QUERY_TIMEOUT, 'Upload'
        );
        if (error) throw error;
        const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
        return data.publicUrl;
    }

    /* ========== ENVIAR FEEDBACK ========== */
    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = editor.innerText.trim();
        if (!text && !pendingImage?.file) {
            toast('Escreva uma mensagem ou anexe uma imagem.', 'error');
            editor.focus();
            return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando...';

        try {
            let imageUrl = null;
            if (pendingImage?.file) {
                submitBtn.textContent = 'Enviando imagem...';
                try {
                    imageUrl = await uploadImageToStorage(pendingImage.file);
                } catch (err) {
                    console.error(err);
                    toast('Imagem falhou: ' + err.message, 'error');
                }
            }

            const payload = {
                name: document.getElementById('name').value.trim() || null,
                email: document.getElementById('email').value.trim() || null,
                message: sanitizeHtml(editor.innerHTML) || text,
            };
            if (imageUrl) payload.image_url = imageUrl;

            // Tenta inserir. Se image_url não existir, tenta sem ela.
            let result = await withTimeout(
                supabase.from(TABLE).insert([payload]),
                QUERY_TIMEOUT, 'Envio'
            );
            if (result.error && payload.image_url && /image_url/.test(result.error.message)) {
                delete payload.image_url;
                result = await withTimeout(
                    supabase.from(TABLE).insert([payload]),
                    QUERY_TIMEOUT, 'Envio'
                );
            }
            if (result.error) throw result.error;

            form.reset();
            editor.innerHTML = '';
            removePendingImage();
            exitFocus();
            goTo('success');
        } catch (err) {
            console.error(err);
            if (/row-level security|permission/i.test(err.message)) {
                toast('Permissão negada. Verifique as policies do Supabase.', 'error');
            } else if (/timeout|demorou/i.test(err.message)) {
                toast(err.message, 'error');
            } else {
                toast('Erro: ' + err.message, 'error');
            }
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Enviar feedback';
        }
    });

    /* ========== LISTAR FEEDBACKS (com fallback) ========== */
    const list = document.getElementById('list');

    async function loadFeedbacks() {
        list.innerHTML = '<div class="loading">Carregando...</div>';

        try {
            // Tenta com image_url primeiro
            let result = await withTimeout(
                supabase.from(TABLE).select('id, name, message, image_url, created_at')
                    .order('created_at', { ascending: false }).limit(50),
                QUERY_TIMEOUT, 'Carregamento'
            );

            // Se falhou por coluna inexistente, tenta sem image_url
            if (result.error && /image_url|column|schema cache/i.test(result.error.message)) {
                console.warn('Coluna image_url não existe. Tentando sem ela...');
                result = await withTimeout(
                    supabase.from(TABLE).select('id, name, message, created_at')
                        .order('created_at', { ascending: false }).limit(50),
                    QUERY_TIMEOUT, 'Carregamento'
                );
            }

            // Último recurso: select('*')
            if (result.error && /column|schema cache/i.test(result.error.message)) {
                console.warn('Tentando select(*) como último recurso...');
                result = await withTimeout(
                    supabase.from(TABLE).select('*')
                        .order('created_at', { ascending: false }).limit(50),
                    QUERY_TIMEOUT, 'Carregamento'
                );
            }

            const { data, error } = result;

            if (error) {
                let hint = error.message;
                if (/permission|row-level security/i.test(error.message)) {
                    hint = 'Sem permissão pra ler. Rode a policy de SELECT no Supabase.';
                } else if (/does not exist|schema cache/i.test(error.message)) {
                    hint = 'Tabela "feedbacks" não existe. Rode o SQL de criação.';
                }
                list.innerHTML = `
                    <div class="error-state">
                        ❌ ${escapeHtml(hint)}
                        <div><button class="retry" onclick="window.__retryLoad?.()">Tentar novamente</button></div>
                    </div>`;
                console.error('Erro ao carregar:', error);
                return;
            }

            if (!data?.length) {
                list.innerHTML = '<div class="empty">Ainda não há feedbacks. Seja o primeiro! ✨</div>';
                return;
            }

            list.innerHTML = data.map((f, i) => {
                const msgHtml = sanitizeHtml(f.message);
                const hasImg = !!f.image_url;
                return `
                    <div class="feedback-item" style="animation-delay:${i * 0.05}s">
                        <div class="feedback-header">
                            <span class="feedback-name">
                                ${escapeHtml(f.name || 'Anônimo')}
                                ${hasImg ? '<span class="fb-badge">📷 imagem</span>' : ''}
                            </span>
                            <span class="feedback-date">${formatDate(f.created_at)}</span>
                        </div>
                        <div class="feedback-msg">${msgHtml}</div>
                        ${hasImg ? `<img src="${escapeHtml(f.image_url)}" alt="" loading="lazy" style="max-width:100%;border-radius:12px;margin-top:10px;">` : ''}
                    </div>`;
            }).join('');

        } catch (err) {
            console.error('Falha crítica:', err);
            const msg = /timeout|demorou/i.test(err.message)
                ? err.message
                : 'Não foi possível carregar os feedbacks.';
            list.innerHTML = `
                <div class="error-state">
                    ❌ ${escapeHtml(msg)}
                    <div><button class="retry" onclick="window.__retryLoad?.()">Tentar novamente</button></div>
                </div>`;
        }
    }
    // Expõe retry pro botão inline
    window.__retryLoad = () => loadFeedbacks();

    /* ========== MODAL CUSTOMIZADO ========== */
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalEl = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalSub = document.getElementById('modal-sub');
    const modalInputWrap = document.getElementById('modal-input-wrap');
    const modalInput = document.getElementById('modal-input');
    const modalEmojiWrap = document.getElementById('modal-emoji-wrap');
    const modalCancel = document.getElementById('modal-cancel');
    const modalConfirm = document.getElementById('modal-confirm');

    let modalResolve = null;

    function closeModal(value = null) {
        modalBackdrop.classList.remove('show');
        modalEl.classList.remove('show');
        if (modalResolve) {
            const r = modalResolve;
            modalResolve = null;
            r(value);
        }
    }
    modalBackdrop.addEventListener('click', () => closeModal(null));
    modalCancel.addEventListener('click', () => closeModal(null));
    modalConfirm.addEventListener('click', () => {
        if (modalInputWrap.style.display === 'none') return;
        const v = modalInput.value.trim();
        closeModal(v || null);
    });
    modalInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const v = modalInput.value.trim();
            closeModal(v || null);
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalEl.classList.contains('show')) {
            e.preventDefault();
            e.stopPropagation();
            closeModal(null);
        }
    }, true);

    function askInput({ title, subtitle = '', placeholder = '', value = '' }) {
        return new Promise((resolve) => {
            modalResolve = resolve;
            modalTitle.textContent = title;
            modalSub.textContent = subtitle;
            modalSub.style.display = subtitle ? 'block' : 'none';
            modalInputWrap.style.display = 'block';
            modalEmojiWrap.style.display = 'none';
            modalInput.type = 'url';
            modalInput.placeholder = placeholder;
            modalInput.value = value;
            modalConfirm.style.display = 'inline-block';

            modalBackdrop.classList.add('show');
            modalEl.classList.add('show');

            setTimeout(() => {
                modalInput.focus();
                modalInput.select();
            }, 200);
        });
    }

            '😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','😇','🥰','😍','🤩',
            '😘','😗','😚','😙','🥲','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐',
            '😐','😑','😶','😏','😒','🙄','😬','🤥','😌','😔','😪','🤤','😴','😷','🤒','🤕',
            '🥳','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥',
            '😮','😯','😲','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😇','🥳','🥸','😎',
        ],
        '👋': [
            '👍','👎','👏','🙌','🤝','🙏','✌️','🤞','🤟','👌','🤌','👋','💪','🦾','✍️','🤙',
            '👈','👉','👆','👇','☝️','✋','🤚','🖐️','🖖','👊','✊','🤛','🤜','🫰','🫱','🫲',
            '🫳','🫴','🫵','🫶','🤲','🤜','🦵','🦶','👂','👃','🫀','🧠','🦷','🦴','👀','👁️',
        ],
        '❤️': [
            '❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖',
            '💘','💝','💟','♥️','💌','💋','👄','🫶','🥰','😍','💐','🌹','🌷','🌸','💐','🎀',
        ],
        '✨': [
            '🔥','✨','⭐','🌟','💫','⚡','💥','🎉','🎊','🎈','🎁','🏆','🥇','🎯','🚀','💡',
            '🎨','🎭','🎬','🎤','🎧','🎵','🎶','🌈','☀️','🌙','⭐','💎','👑','🎓','📚','💻',
            '📱','💾','⌚','📷','🎮','🕹️','🎲','🃏','🎰','🏅','🥈','🥉','🏆','🎖️','🏵️','🎗️',
        ],
        '🍔': [
            '🍔','🍕','🍟','🌭','🥪','🌮','🌯','🥙','🧆','🍜','🍝','🍣','🍱','🍛','🍚','🍙',
            '🍘','🍥','🥠','🥮','🍢','🍡','🍧','🍨','🍦','🥧','🧁','🍰','🎂','🍮','🍭','🍬',
            '🍫','🍿','🍩','🍪','☕','🍵','🧋','🥤','🍺','🍻','🍷','🍸','🍹','🥂','🍾','🧊',
        ],
    };

    function askEmoji() {
        return new Promise((resolve) => {
            modalResolve = resolve;
            modalTitle.textContent = 'Escolha um emoji';
            modalSub.textContent = 'Toque para inserir no texto.';
            modalSub.style.display = 'block';
            modalInputWrap.style.display = 'none';
            modalEmojiWrap.style.display = 'flex';
            modalConfirm.style.display = 'none';

            const tabsEl = document.getElementById('emoji-tabs');
            const gridEl = document.getElementById('emoji-grid');
            const categories = Object.keys(EMOJI_CATEGORIES);

            function renderGrid(cat) {
                gridEl.innerHTML = EMOJI_CATEGORIES[cat]
                    .map(e => `<button type="button" data-emoji="${e}">${e}</button>`)
                    .join('');
                gridEl.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        closeModal(btn.dataset.emoji);
                    });
                });
            }
            tabsEl.innerHTML = categories
                .map((cat, i) => `<button type="button" data-cat="${cat}" class="${i === 0 ? 'on' : ''}">${cat}</button>`)
                .join('');
            tabsEl.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    tabsEl.querySelectorAll('button').forEach(b => b.classList.remove('on'));
                    btn.classList.add('on');
                    renderGrid(btn.dataset.cat);
                });
            });
            renderGrid(categories[0]);

            modalBackdrop.classList.add('show');
            modalEl.classList.add('show');
        });
    }

    /* ========== INIT ========== */
    // Se o usuário já está na tela de ver, carrega
    if (currentScreen === 'view') loadFeedbacks();
</script>
