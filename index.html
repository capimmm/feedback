<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <style>
        /* Design Tokens inspirados no Apple HIG */
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --background: #f5f5f7;
            --surface: rgba(255, 255, 255, 0.7);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border-radius: 16px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            /* Curvas de animação Apple (spring-like) */
            --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
            --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background-color: var(--background);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* Efeito de vidro (Liquid Glass) */
        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            transition: transform 0.4s var(--ease-spring), box-shadow 0.4s var(--ease-spring);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            font-family: var(--font-family);
            font-size: 16px;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s var(--ease-out-quart), box-shadow 0.2s var(--ease-out-quart);
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        textarea { resize: vertical; min-height: 120px; }

        button {
            width: 100%;
            padding: 16px;
            font-family: var(--font-family);
            font-size: 17px;
            font-weight: 600;
            color: white;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s var(--ease-spring), background 0.2s var(--ease-out-quart);
        }

        button:hover { background: #0077ed; }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px 0;
            color: var(--accent);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div id="form-container">
            <h1>Envie seu Feedback</h1>
            <p class="subtitle">Sua opinião é muito importante para nós.</p>

            <form id="feedback-form">
                <div class="form-group">
                    <label for="name">Nome (opcional)</label>
                    <input type="text" id="name" name="name" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label for="email">E-mail (opcional)</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Mensagem *</label>
                    <textarea id="message" name="message" placeholder="Escreva seu feedback aqui..." required></textarea>
                </div>
                <button type="submit" id="submit-btn">Enviar Feedback</button>
            </form>
        </div>
        <div id="success-message" class="success-message">
            <h1>Obrigado! 🎉</h1>
            <p>Seu feedback foi enviado com sucesso.</p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // ⚠️ SUBSTITUA PELAS SUAS CHAVES DO SUPABASE
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('feedback-form');
        const formContainer = document.getElementById('form-container');
        const successMessage = document.getElementById('success-message');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';

            const formData = new FormData(form);
            const name = formData.get('name');
            const email = formData.get('email');
            const message = formData.get('message');

            const { error } = await supabase
                .from('feedbacks')
                .insert([{ name, email, message }]);

            if (error) {
                console.error('Erro ao enviar:', error);
                alert('Ocorreu um erro. Tente novamente.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar Feedback';
            } else {
                formContainer.style.display = 'none';
                successMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
